<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#faf7f0">
<title>卵の抽選 | 抽選デモ</title>
<style>

:root{color-scheme:light;--ink:#203d34;--muted:#617269;--accent:#23624d;--paper:#faf7f0;--gold:#bc843a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.7}main{width:min(100%,520px);margin:auto;padding:24px 20px 36px}a{color:var(--accent);text-underline-offset:4px}.back{font-size:14px;display:inline-block;padding:8px 0;min-height:44px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--muted);margin:18px 0 8px}h1{font-size:30px;line-height:1.35;margin:0 0 10px;letter-spacing:.04em}.lead{font-size:14px;color:var(--muted);margin:0 0 20px}.badge{display:inline-block;font-size:11px;font-weight:700;border:1px solid #d8c5a5;color:#785321;border-radius:20px;padding:3px 10px;margin-bottom:12px}.stage{position:relative;background:#fff;border:1px solid #e0e5dc;border-radius:24px;padding:24px 14px;box-shadow:0 12px 35px #284b3510}.visual{width:min(100%,300px);margin:auto;position:relative}svg{display:block;width:100%;height:auto;overflow:visible}.pointer{position:absolute;z-index:2;left:calc(50% - 10px);top:-4px;width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:22px solid #203d34}.wheel{transform-origin:center;transition:transform 2.2s cubic-bezier(.16,.7,.12,1)}button{font:inherit;cursor:pointer;touch-action:manipulation}.start{display:block;width:100%;border:0;border-radius:14px;background:var(--accent);color:white;min-height:56px;padding:13px 20px;font-size:18px;font-weight:700;margin-top:22px;box-shadow:0 5px 0 #174332}.start:disabled{background:#74877a;box-shadow:none;cursor:default}.result{min-height:62px;text-align:center;padding-top:20px;font-size:20px;font-weight:700}.note{font-size:12px;color:var(--muted);margin-top:20px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.choice{min-height:54px;border:1px solid #c7d6c9;border-radius:12px;background:#f4f7f1;color:var(--ink)}.choice[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}.choice:disabled{cursor:default}.hint{font-size:13px;text-align:center;color:var(--muted);margin:0}.ticket{width:150px;height:170px;margin:18px auto;border-radius:14px;background:#e9d5ad;display:grid;place-content:center;font-size:50px;border:2px dashed #9e773f;color:#624c2c;transition:transform .5s}.drawing{animation:shake .18s infinite alternate}.result-card{background:#f2f7ef;color:#23624d;border:2px solid #9db69d;transform:rotate(-5deg)}@keyframes shake{to{transform:rotate(6deg)}}.menu{display:grid;gap:14px;margin:24px 0}.menu a{background:white;border:1px solid #dbe2d7;border-radius:18px;padding:20px;text-decoration:none;color:var(--ink)}.menu strong{display:block;font-size:21px}.menu span{display:block;font-size:13px;color:var(--muted);margin-top:6px}:focus-visible{outline:3px solid var(--gold);outline-offset:4px}[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

.egg-choice{display:grid;justify-items:center;gap:7px;padding:10px 3px;font-size:13px}
.egg-choice[aria-pressed=true]{background:#e7eee3;color:var(--ink);box-shadow:inset 0 0 0 2px var(--accent)}
.shell{display:grid;place-items:center;width:clamp(42px,15vw,72px);aspect-ratio:3/4;border-radius:50% 50% 47% 47% / 63% 63% 37% 37%;background:radial-gradient(ellipse at 34% 28%,#fff5dc,#edd3a7 62%,#c69b64);color:#563a1c;font-size:27px;font-weight:800;box-shadow:0 3px 5px #68432322;line-height:1}
.egg-choice:nth-child(2) .shell{background:radial-gradient(ellipse at 34% 28%,#fff7ec,#eac5b1 62%,#c48e75)}
.egg-choice:nth-child(3) .shell{background:radial-gradient(ellipse at 34% 28%,#fffbe9,#e9dfaa 62%,#b9aa68)}
.egg-choice.open .shell{background:#fff7d8;box-shadow:inset 0 0 0 2px #b77934,0 3px 5px #68432322}
</style>
</head>
<body><main>
<a class="back" href="../">← 抽選一覧へ</a>
<h1>卵の抽選</h1>
<p class="lead">好きな卵を1つ選び、「スタート」を押してください。</p>
<section class="stage" aria-label="卵を選ぶ">
  <div class="choices">
    <button class="choice egg-choice" type="button" aria-pressed="false"><span class="shell" aria-hidden="true"></span>左の卵</button>
    <button class="choice egg-choice" type="button" aria-pressed="false"><span class="shell" aria-hidden="true"></span>中央の卵</button>
    <button class="choice egg-choice" type="button" aria-pressed="false"><span class="shell" aria-hidden="true"></span>右の卵</button>
  </div>
  <button class="start" id="start" type="button" disabled>スタート</button>
  <div class="result" id="result" role="status" aria-atomic="true">卵を選んでください</div>
</section>
<p class="note">景品・クーポンのない体験デモです。</p>
<noscript>JavaScriptを有効にしてご利用ください。</noscript>
</main>
<script>

'use strict';
// 景品未設定のデモ。すべての結果は番号のみで、景品の当選を意味しません。
function randomInt(n) {
  if (!Number.isSafeInteger(n) || n < 1 || n > 0x100000000) throw new Error('乱数範囲が不正です');
  const limit = Math.floor(0x100000000 / n) * n;
  const buffer = new Uint32Array(1);
  do { crypto.getRandomValues(buffer); } while (buffer[0] >= limit);
  return buffer[0] % n;
}
const start = document.getElementById('start');
const result = document.getElementById('result');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let busy = false;
function begin() {
  if (busy) return false;
  busy = true; start.disabled = true; start.textContent = '抽選中…';
  result.textContent = '結果をお待ちください';
  document.querySelectorAll('.choice').forEach(button => button.disabled = true);
  return true;
}
function finish(number) {
  result.textContent = 'デモ結果：' + number + ' 番';
  start.textContent = 'もう一度試す'; start.disabled = false; busy = false;
  document.querySelectorAll('.choice').forEach(button => button.disabled = false);
}
function fail(error) {
  console.error(error); result.textContent = '抽選できませんでした。ページを開き直してください。';
  start.textContent = '利用できません'; start.disabled = true;
}
function choose(buttons, onChoose) {
  buttons.forEach((button, index) => button.addEventListener('click', () => {
    if (busy) return;
    buttons.forEach(item => item.setAttribute('aria-pressed', String(item === button)));
    onChoose(index);
  }));
}



const eggs = [...document.querySelectorAll('.egg-choice')];
let selected = null;
choose(eggs, index => {
  selected = eggs[index];
  eggs.forEach(egg => {
    egg.classList.remove('open');
    egg.querySelector('.shell').textContent = '';
  });
  start.disabled = false;
  start.textContent = 'スタート';
  result.textContent = '準備ができたらスタート';
});
start.addEventListener('click', () => {
  if (!selected || !begin()) return;
  const shell = selected.querySelector('.shell');
  selected.classList.remove('open');
  shell.textContent = '';
  try {
    const number = randomInt(6) + 1;
    shell.classList.add('drawing');
    setTimeout(() => {
      shell.classList.remove('drawing');
      selected.classList.add('open');
      shell.textContent = String(number);
      finish(number);
    }, reducedMotion ? 0 : 650);
  } catch (error) { fail(error); }
});
</script>
</body></html>
